name: Build & Deploy (Hugo landing + Doks docs)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BASE_URL: https://forq.sh
  # Must satisfy site/themes/hugoplate/theme.toml min_version (0.165.0).
  HUGO_VERSION: "0.169.0"
  # Thulite 3 (docs) transpiles SCSS with Dart Sass, which Hugo needs as an external binary.
  DART_SASS_VERSION: "1.107.1"
  DART_SASS_SHA256: "6cefe78692d03ca53843394bb98de4dccf9a3d8ee5ece40be7316be852624003"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install Dart Sass
        run: |
          tarball="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${tarball}"
          echo "${DART_SASS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Verify Dart Sass
        run: sass --embedded --version

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # Build landing to _site/
      - name: Install deps (landing)
        working-directory: site
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Build landing
        working-directory: site
        run: |
          hugo --minify \
               --baseURL "${{ env.BASE_URL }}" \
               --destination "${{ github.workspace }}/_site"

      # Build docs to _site/docs/
      - name: Install deps (docs)
        working-directory: docs
        run: |
          if [ -f package.json ]; then npm ci; fi

      # Generate API documentation from OpenAPI spec
      - name: Generate API docs
        run: |
          npm install -g @redocly/cli
          mkdir -p docs/static/api
          npx @redocly/cli build-docs openapi.yaml --output docs/static/api/index.html
          cp openapi.yaml docs/static/api/

      - name: Build docs
        working-directory: docs
        run: |
          hugo --minify --gc \
               --baseURL "${{ env.BASE_URL }}/documentation-portal/" \
               --destination "${{ github.workspace }}/_site/documentation-portal"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
