<!DOCTYPE html>
<html lang="en" data-theme="light" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Data.Title}} - Forq Admin UI</title>

    <!-- Tailwind CSS + DaisyUI, precompiled and embedded into the binary -->
    <link href="/static/styles.css" rel="stylesheet" type="text/css" />

    <!-- HTMX. history: Back reloads instead of re-swapping a fetched page;
         noSwap 5xx: plain-text http.Error bodies never replace a target -->
    <meta name="htmx-config" content='{"history":"reload","noSwap":[204,304,"5xx"]}'>
    <script src="/static/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-base-200">
    {{template "content" .}}

    <script src="/static/theme.js"></script>
    <script src="/static/ui.js"></script>
</body>
</html>
